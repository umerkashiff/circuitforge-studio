<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>CircuitForge Recording Studio Stage</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    #stage-wrap {
      width: 100%;
      height: 100%;
      position: relative;
      background: transparent;
    }
    #stage-cv {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }
  </style>
</head>
<body>
  <div id="stage-wrap"><canvas id="stage-cv"></canvas></div>
  <script type="module" src="./stage.js"></script>
</body>
</html>
